services:
  # Backend Web Service
  - type: web
    name: co-devs
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    # Force single instance to prevent WebSocket room splitting
    scaling:
      minInstances: 1
      maxInstances: 1
    # Add health check for better reliability
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Set this manually in Render dashboard for security
      - key: JWT_SECRET
        sync: false  # Set this manually in Render dashboard for security
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: co-devs-front
          property: url
      # Add Render-specific environment detection
      - key: RENDER_DEPLOYMENT
        value: "true"
      - key: MAX_TERMINALS_PER_SESSION
        value: "3"
      - key: TERMINAL_TIMEOUT_MS
        value: "1800000"  # 30 minutes

  # Frontend Static Site
  - type: web
    name: co-devs-front
    env: static
    plan: free
    buildCommand: cd frontend/vue-project && npm install && npm run build
    staticPublishPath: frontend/vue-project/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: co-devs
          property: url
      - key: VITE_NODE_ENV
        value: production
